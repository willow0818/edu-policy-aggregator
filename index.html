<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每周教育政策资讯</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>每周教育政策资讯</h1>
            <p class="subtitle">职业教育 · 本科教育</p>
            <p class="last-updated" id="last-updated"></p>
        </header>

        <nav class="nav-bar">
            <div class="nav-left">
                <button class="nav-item active" data-filter="all">全部</button>

                <div class="nav-dropdown">
                    <button class="nav-item nav-dropdown-btn" data-filter="教育政策">
                        教育政策
                        <span class="arrow">▾</span>
                    </button>
                    <div class="nav-dropdown-menu">
                        <div class="dropdown-submenu">
                            <button class="nav-item submenu-btn" data-filter="本科教育">本科教育</button>
                            <div class="submenu-items">
                                <button class="nav-item sub-item" data-filter="本科教育-国家">国家政策</button>
                                <button class="nav-item sub-item" data-filter="本科教育-省级">省级政策</button>
                            </div>
                        </div>
                        <div class="dropdown-submenu">
                            <button class="nav-item submenu-btn" data-filter="职业教育">职业教育</button>
                            <div class="submenu-items">
                                <button class="nav-item sub-item" data-filter="职业教育-国家">国家政策</button>
                                <button class="nav-item sub-item" data-filter="职业教育-省级">省级政策</button>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="nav-item" data-filter="友商">友商资讯</button>
                <button class="nav-item" data-filter="行业">行业动态</button>
            </div>
            <div class="nav-right">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索政策资讯...">
                </div>
            </div>
        </nav>

        <div class="content">
            <div class="stats-bar">
                <span id="article-count">共 0 条</span>
                <span class="current-filter" id="current-filter">全部</span>
            </div>

            <div class="article-list" id="article-list">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <footer class="footer">
            <p>每周自动更新 · 数据来源于各政府官网及主流媒体</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/locale/zh-cn.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

name: Weekly Education Policy Scrape and Deploy

on:
  schedule:
    # Every Sunday at 2:00 AM (UTC+8 / Beijing time)
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main  # Also run on main branch push

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Run scraper
        run: python -m src.scraper.main
        env:
          SCRAPE_LOG_LEVEL: INFO

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit articles update
        run: |
          if git diff --stat | grep -q "articles.json"; then
            git add data/articles.json
            git commit -m "Update articles $(date -I)"
            git push
          else
            echo "No changes to articles.json"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
